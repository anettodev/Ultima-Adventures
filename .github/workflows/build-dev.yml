name: Build Dev (Linux)

# Fast builds for development using Linux + Mono
# For dev branch only - faster iteration, lower cost

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-dev:
    name: Build Scripts.dll (Linux/Mono)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Mono and build tools
      run: |
        echo "Installing Mono and MSBuild..."
        sudo apt-get update
        sudo apt-get install -y mono-complete msbuild nuget

        echo "Installed versions:"
        mono --version
        msbuild -version

    - name: Restore NuGet packages
      run: |
        nuget restore Scripts/Scripts.csproj

    - name: Build Scripts.csproj
      run: |
        msbuild Scripts/Scripts.csproj \
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} \
          /p:Platform=AnyCPU \
          /p:OutputPath=../bin/Release/ \
          /verbosity:minimal

    - name: Verify Scripts.dll
      id: verify
      run: |
        if [ -f "bin/Release/Scripts.dll" ]; then
          echo "✓ Scripts.dll compiled successfully"
          SIZE=$(du -h bin/Release/Scripts.dll | cut -f1)
          echo "  Size: $SIZE"
          echo "size=$SIZE" >> $GITHUB_OUTPUT
        else
          echo "✗ Scripts.dll not found!"
          exit 1
        fi

    - name: Get version info
      id: version
      run: |
        COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
        DATE=$(date +%Y.%m.%d)
        VERSION="dev-$DATE-$COMMIT"

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "date=$DATE" >> $GITHUB_OUTPUT

        echo "Dev Build Version: $VERSION"

    - name: Create version file
      run: |
        cat > bin/Release/VERSION.txt << EOF
        NMS UO Server - DEV BUILD
        Version: ${{ steps.version.outputs.version }}
        Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Commit: ${{ steps.version.outputs.commit }}
        Branch: dev
        Platform: Linux/Mono

        ⚠️  WARNING: This is a development build
        - Built with Mono on Linux
        - Not thoroughly tested for production
        - Use for development/testing only
        EOF

    - name: Upload Scripts.dll
      uses: actions/upload-artifact@v4
      with:
        name: scripts-dll-dev-${{ steps.version.outputs.version }}
        path: bin/Release/Scripts.dll
        retention-days: 5

    - name: Upload full build
      uses: actions/upload-artifact@v4
      with:
        name: dev-build-${{ steps.version.outputs.version }}
        path: |
          bin/Release/Scripts.dll
          bin/Release/VERSION.txt
        retention-days: 5

    - name: Comment on PR (if PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');

          let message = '## 🐧 Dev Build Results (Linux/Mono)\n\n';

          if (fs.existsSync('bin/Release/Scripts.dll')) {
            const stats = fs.statSync('bin/Release/Scripts.dll');
            const sizeMB = (stats.size / 1024 / 1024).toFixed(2);

            message += '✅ **Build Successful**\n\n';
            message += `- **Platform:** Linux/Mono\n`;
            message += `- **Scripts.dll size:** ${sizeMB} MB\n`;
            message += `- **Version:** ${{ steps.version.outputs.version }}\n`;
            message += `- **Commit:** ${{ steps.version.outputs.commit }}\n`;
            message += `- **Branch:** dev\n\n`;
            message += '⚠️ **Note:** This is a Mono build. Test before using in production.\n';
          } else {
            message += '❌ **Build Failed**\n\n';
            message += 'Scripts.dll was not generated. Check the build logs.\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });

    - name: Build summary
      if: always()
      run: |
        echo "## Dev Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform:** Linux/Mono 🐧" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Size:** ${{ steps.verify.outputs.size }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⚡ Fast Linux builds for rapid development iteration!" >> $GITHUB_STEP_SUMMARY
