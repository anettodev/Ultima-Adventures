name: Nightly Build (Dev)

# Runs twice weekly on dev branch to catch build regressions
# Monday and Thursday at 3 AM UTC

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday at 3 AM UTC
    - cron: '0 3 * * 4'  # Thursday at 3 AM UTC
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

jobs:
  nightly:
    name: Nightly Build (Dev Branch - Linux/Mono)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout dev branch
      uses: actions/checkout@v4
      with:
        ref: dev  # Always build from dev branch

    - name: Validate Scripts.csproj configuration
      run: |
        echo "Nightly validation of Scripts.csproj..."

        # Check that test-scripts exclusion exists
        if grep -q '<Compile Remove="test-scripts/\*\*/\*.cs" />' Scripts/Scripts.csproj; then
          echo "✓ test-scripts exclusion rule found"
        else
          echo "✗ test-scripts exclusion rule missing!"
          exit 1
        fi

        # Count excluded files
        EXPERIMENTAL_COUNT=$(find Scripts/test-scripts/Experimental -name "*.cs" 2>/dev/null | wc -l)
        OPTIONAL_COUNT=$(find Scripts/test-scripts/OptionalSystems -name "*.cs" 2>/dev/null | wc -l)
        EXTRA_COUNT=$(find Scripts/test-scripts/ExtraContent -name "*.cs" 2>/dev/null | wc -l)
        TOTAL=$((EXPERIMENTAL_COUNT + OPTIONAL_COUNT + EXTRA_COUNT))

        echo ""
        echo "Files excluded from compilation:"
        echo "  Experimental: $EXPERIMENTAL_COUNT"
        echo "  OptionalSystems: $OPTIONAL_COUNT"
        echo "  ExtraContent: $EXTRA_COUNT"
        echo "  Total: $TOTAL files"

        echo ""
        echo "✓ Nightly validation passed"
        echo "✓ Project configuration intact"

    - name: Get version
      id: version
      run: |
        DATE=$(date +%Y.%m.%d)
        COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
        DAY=$(date +%A)
        VERSION="nightly-$DATE-$COMMIT-$DAY"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Nightly build version: $VERSION"

    - name: Create validation report
      run: |
        mkdir -p bin/Release
        cat > bin/Release/NIGHTLY-VALIDATION.txt << 'EOF'
        # NMS UO Server - Nightly Validation

        ⚠️ **This is an automated nightly validation**
        - Validates dev branch configuration
        - Runs Monday & Thursday at 3 AM UTC
        - Ensures test-scripts exclusion is intact

        ## Validation Information

        - **Version:** ${{ steps.version.outputs.version }}
        - **Branch:** dev
        - **Validation Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - **Commit:** ${{ github.sha }}

        ## What Was Validated

        ✓ test-scripts exclusion rule present in Scripts.csproj
        ✓ Project configuration syntax valid
        ✓ Excluded files counted and verified

        ## Architecture Note

        This server uses runtime compilation:
        - Server code embedded in LinuxServer.exe
        - Scripts compiled at startup via ScriptCompiler
        - CI/CD validates configuration, not compilation
        ```

        ## Testing Nightly Builds

        1. Deploy to test server only (never production)
        EOF

    - name: Upload validation report
      uses: actions/upload-artifact@v4
      with:
        name: nightly-validation-${{ steps.version.outputs.version }}
        path: bin/Release/NIGHTLY-VALIDATION.txt
        retention-days: 5  # Keep only 5 days (same as dev builds)

    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const date = new Date().toISOString().split('T')[0];
          const day = new Date().toLocaleDateString('en-US', { weekday: 'long' });

          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Nightly validation failed - ${day}, ${date}`,
            body: `## 🚨 Nightly Validation Failure\n\n` +
                  `The nightly validation on **dev** branch has failed.\n\n` +
                  `- **Date:** ${date}\n` +
                  `- **Day:** ${day}\n` +
                  `- **Branch:** dev\n` +
                  `- **Workflow Run:** [View Logs](${context.payload.repository.html_url}/actions/runs/${context.runId})\n\n` +
                  `### Action Required\n\n` +
                  `1. Check the workflow logs for errors\n` +
                  `2. Verify test-scripts exclusion rule in Scripts.csproj\n` +
                  `3. Fix any configuration issues on dev branch\n\n` +
                  `This issue was automatically created by the nightly validation workflow.`,
            labels: ['validation-failure', 'automated', 'nightly-validation', 'dev']
          });

    - name: Validation summary
      if: always()
      run: |
        echo "## Nightly Validation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Schedule:** Monday & Thursday at 3 AM UTC" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "bin/Release/NIGHTLY-VALIDATION.txt" ]; then
          echo "✅ **Validation Status:** Success" >> $GITHUB_STEP_SUMMARY
          echo "✓ test-scripts exclusion verified" >> $GITHUB_STEP_SUMMARY
          echo "✓ Project configuration intact" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Validation Status:** Failed" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🌙 Automated nightly validation to catch configuration regressions early." >> $GITHUB_STEP_SUMMARY
