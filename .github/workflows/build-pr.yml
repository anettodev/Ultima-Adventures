name: Build PR

# Validates pull requests can build successfully
# Uses platform matching target branch:
# - PR to main → Windows build
# - PR to dev → Linux build

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  detect-target:
    name: Detect Target Branch
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.detect.outputs.platform }}
      runner: ${{ steps.detect.outputs.runner }}
    steps:
      - name: Detect platform based on target branch
        id: detect
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          echo "Target branch: $TARGET_BRANCH"

          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "platform=Windows" >> $GITHUB_OUTPUT
            echo "runner=windows-latest" >> $GITHUB_OUTPUT
            echo "→ Using Windows build (production standards)"
          else
            echo "platform=Linux" >> $GITHUB_OUTPUT
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "→ Using Linux build (fast iteration)"
          fi

  build-windows:
    name: Build PR (Windows/MSBuild)
    needs: detect-target
    if: needs.detect-target.outputs.platform == 'Windows'
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore Scripts/Scripts.csproj

    - name: Build Scripts.csproj
      run: msbuild Scripts/Scripts.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=../bin/Release/

    - name: Verify build
      id: verify
      run: |
        if (Test-Path "bin/Release/Scripts.dll") {
          $size = (Get-Item "bin/Release/Scripts.dll").Length / 1MB
          Write-Host "✓ Build successful!"
          Write-Host "  Scripts.dll size: $($size.ToString('F2')) MB"
          echo "size=$($size.ToString('F2')) MB" >> $env:GITHUB_OUTPUT
        } else {
          Write-Error "Build failed - Scripts.dll not found"
          exit 1
        }
      shell: pwsh

    - name: Comment on PR
      uses: actions/github-script@v7
      if: always()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const dllPath = 'bin/Release/Scripts.dll';

          let message = '## 🪟 Build Results (Windows/MSBuild)\n\n';

          if (fs.existsSync(dllPath)) {
            const stats = fs.statSync(dllPath);
            const sizeMB = (stats.size / 1024 / 1024).toFixed(2);

            message += `✅ **Build Successful**\n\n`;
            message += `- **Platform:** Windows/MSBuild\n`;
            message += `- **Scripts.dll size:** ${sizeMB} MB\n`;
            message += `- **Target:** main (production)\n`;
            message += `- **Commit:** ${context.sha.substring(0, 7)}\n\n`;
            message += `✨ Production-ready build validated!\n`;
          } else {
            message += `❌ **Build Failed**\n\n`;
            message += `Scripts.dll was not generated. Check the build logs.\n`;
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });

  build-linux:
    name: Build PR (Linux/Mono)
    needs: detect-target
    if: needs.detect-target.outputs.platform == 'Linux'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Scripts.csproj configuration
      run: |
        echo "Validating Scripts.csproj for dev PR..."

        # Check that test-scripts exclusion exists
        if grep -q '<Compile Remove="test-scripts/\*\*/\*.cs" />' Scripts/Scripts.csproj; then
          echo "✓ test-scripts exclusion rule found"
        else
          echo "✗ test-scripts exclusion rule missing!"
          exit 1
        fi

        # Count excluded files
        EXPERIMENTAL_COUNT=$(find Scripts/test-scripts/Experimental -name "*.cs" 2>/dev/null | wc -l)
        OPTIONAL_COUNT=$(find Scripts/test-scripts/OptionalSystems -name "*.cs" 2>/dev/null | wc -l)
        EXTRA_COUNT=$(find Scripts/test-scripts/ExtraContent -name "*.cs" 2>/dev/null | wc -l)
        TOTAL=$((EXPERIMENTAL_COUNT + OPTIONAL_COUNT + EXTRA_COUNT))

        echo ""
        echo "Files excluded from compilation:"
        echo "  Experimental: $EXPERIMENTAL_COUNT"
        echo "  OptionalSystems: $OPTIONAL_COUNT"
        echo "  ExtraContent: $EXTRA_COUNT"
        echo "  Total: $TOTAL files"

        echo ""
        echo "✓ PR validation passed"

    - name: Verification summary
      id: verify
      run: |
        echo "validation=passed" >> $GITHUB_OUTPUT
        echo "✓ Configuration validated for dev PR"

    - name: Comment on PR
      uses: actions/github-script@v7
      if: always()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { execSync } = require('child_process');

          let message = '## 🐧 Dev PR Validation Results\n\n';

          try {
            // Count excluded files
            const expCount = execSync('find Scripts/test-scripts/Experimental -name "*.cs" 2>/dev/null | wc -l || echo 0').toString().trim();
            const optCount = execSync('find Scripts/test-scripts/OptionalSystems -name "*.cs" 2>/dev/null | wc -l || echo 0').toString().trim();
            const extraCount = execSync('find Scripts/test-scripts/ExtraContent -name "*.cs" 2>/dev/null | wc -l || echo 0').toString().trim();
            const total = parseInt(expCount) + parseInt(optCount) + parseInt(extraCount);

            message += `✅ **Validation Successful**\n\n`;
            message += `- **Target:** dev (development)\n`;
            message += `- **Commit:** ${context.sha.substring(0, 7)}\n\n`;
            message += `**Excluded Files:**\n`;
            message += `- Experimental: ${expCount}\n`;
            message += `- OptionalSystems: ${optCount}\n`;
            message += `- ExtraContent: ${extraCount}\n`;
            message += `- **Total:** ${total} files\n\n`;
            message += `✓ test-scripts exclusion rule verified\n`;
            message += `✓ Project configuration valid\n\n`;
            message += `**Note:** Actual compilation happens at runtime by LinuxServer.exe\n`;
          } catch (error) {
            message += `❌ **Validation Failed**\n\n`;
            message += `Error during validation. Check the workflow logs.\n`;
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });
